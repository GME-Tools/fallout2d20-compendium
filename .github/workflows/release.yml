name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run ci
      - name: Gate release on exact Foundry qualification
        env:
          FOUNDRY_QUALIFIED_SHA: ${{ vars.FOUNDRY_QUALIFIED_SHA }}
          FOUNDRY_EXPECTED_VERSION: ${{ vars.FOUNDRY_EXPECTED_VERSION }}
          FOUNDRY_EXPECTED_SYSTEM_VERSION: ${{ vars.FOUNDRY_EXPECTED_SYSTEM_VERSION }}
        run: node scripts/verify-foundry-qualification.mjs
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-release-tag.mjs
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/fallout2d20-compendium.zip
            dist/module.json
